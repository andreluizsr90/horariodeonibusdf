services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: horariodeonibusdf:latest
    container_name: horariodeonibusdf
    restart: unless-stopped
    ports:
      # A imagem trafex/php-nginx escuta na 8080 (usuário não-root).
      - "3000:8080"
    volumes:
      # Credenciais e configuração pública ficam FORA da imagem — o app lê
      # este arquivo em runtime (config/env.php).
      - ./.env:/var/www/html/.env:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/robots.txt"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
