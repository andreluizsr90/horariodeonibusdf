services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: horariodeonibusdf:latest
    container_name: horariodeonibusdf
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      # Credenciais ficam fora da imagem — lidas em runtime.
      - ./.env:/var/www/html/.env:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/robots.txt"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
