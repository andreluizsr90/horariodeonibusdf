# nginx — Horário de Ônibus DF (PHP puro) sobre trafex/php-nginx.
# Substitui /etc/nginx/conf.d/default.conf da imagem.
server {
    listen [::]:8080 default_server;
    listen 8080 default_server;
    server_name _;

    sendfile off;
    tcp_nodelay on;
    absolute_redirect off;

    # Front controller fica em public/ — src/, templates/, data/, vendor/ e o
    # .env ficam FORA da raiz web e são inacessíveis pelo navegador.
    root /var/www/html/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html { root /var/lib/nginx/html; }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_index index.php;
        include fastcgi_params;
    }

    # Assets com cache longo — as URLs carregam ?v=mtime, então a publicação
    # de uma nova versão invalida o cache naturalmente.
    # O try_files com fallback é essencial: rotas dinâmicas com estas extensões
    # (ex.: /sitemap.xml) precisam continuar chegando ao PHP.
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri /index.php$is_args$args;
    }

    # O service worker não pode ser cacheado, senão o app trava numa versão.
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-cache";
        try_files $uri /index.php$is_args$args;
    }

    location ~ /\. { log_not_found off; deny all; }

    # Endpoints de status do PHP-FPM. O HEALTHCHECK da imagem base bate em
    # /fpm-ping — sem esta location a requisição cairia no roteador da
    # aplicação (404) e o container seria marcado como "unhealthy".
    # Acesso restrito ao próprio container.
    location ~ ^/(fpm-status|fpm-ping)$ {
        access_log off;
        allow 127.0.0.1;
        allow ::1;
        deny all;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_pass unix:/run/php-fpm.sock;
    }
}
