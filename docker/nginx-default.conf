# =========================================================================
#  nginx — Horário de Ônibus DF (Trongate) sobre trafex/php-nginx
#
#  Substitui /etc/nginx/conf.d/default.conf da imagem. Diferenças em relação
#  ao arquivo padrão:
#   1. root aponta para /var/www/html/public (front controller do Trongate),
#      substituindo o .htaccess da raiz que redireciona tudo para public/.
#   2. A location de cache de assets NÃO intercepta rotas dinâmicas: sem o
#      `try_files ... /index.php`, URLs como /sitemap.xml (gerada por PHP,
#      sem arquivo em disco) cairiam nela e retornariam 404.
# =========================================================================
server {
    listen [::]:8080 default_server;
    listen 8080 default_server;
    server_name _;

    sendfile off;
    tcp_nodelay on;
    absolute_redirect off;

    # Front controller do Trongate.
    root /var/www/html/public;
    index index.php index.html;

    # Equivalente ao public/.htaccess: se não existir arquivo/diretório,
    # entrega ao index.php. O Trongate lê a rota de $_SERVER['REQUEST_URI'],
    # que é preservado pelo try_files.
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /var/lib/nginx/html;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_index index.php;
        include fastcgi_params;
    }

    # Cache de assets ESTÁTICOS. O `try_files` com fallback para o index.php
    # é essencial: garante que rotas dinâmicas com essas extensões
    # (ex.: /sitemap.xml) continuem sendo processadas pelo PHP.
    location ~* \.(jpg|jpeg|gif|png|css|js|ico|svg|webp|woff2?)$ {
        expires 5d;
        try_files $uri /index.php$is_args$args;
    }

    # Bloqueia arquivos ocultos (inclui .env e .git).
    location ~ /\. {
        log_not_found off;
        deny all;
    }

    location ~ ^/(fpm-status|fpm-ping)$ {
        access_log off;
        allow 127.0.0.1;
        deny all;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_pass unix:/run/php-fpm.sock;
    }
}
